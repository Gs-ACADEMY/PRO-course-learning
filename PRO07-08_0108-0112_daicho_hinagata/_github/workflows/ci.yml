# CI：PR を出すたび（と main に入ったとき）に、型チェックとテストを機械が自動で確かめる
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # コードを読むだけ

jobs:
  check:
    name: 型チェックとテスト
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # prisma.config.ts が DATABASE_URL を読むので、形だけの値を入れておく（CI ではデータベースにつながない）
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7

      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          # Next.js 16 は Node.js 20.9 以上、Vitest 5 は 22.12 以上が必要。
          # 長期サポート（LTS）が 2028 年 4 月まで続く 24 を使う
          node-version: 24
          cache: npm

      - name: パッケージを入れる
        run: npm ci # package-lock.json のとおりに入れる

      - name: Prisma のクライアント（型）を作る
        run: npx prisma generate # npm ci の最後（postinstall）でも作られる。手順として見えるように書いておく

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test
